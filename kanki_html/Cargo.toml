[package]
name = "kanki_html"
version = "0.1.0"
edition = "2021"
description = "Clean Anki card HTML for KOReader's e-ink HTML renderer; flatten image-occlusion masks"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
regex = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.45"
